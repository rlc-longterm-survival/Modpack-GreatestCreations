name = "Chunky"
# Yes we ship a disabled-by-default Chunky jar.
# It conflicts with the current Distant Horizons:
#   - DH 3.3.3: Crashes.
#   - DH pre-3.3.3: Chunky will make DH unable to generate DH for unloaded areas.
# One should only temporarily enable this (and disable DH) when performantly
# pregenerating the world (when no other players are online) is desired, and
# then re-enable DH (disabling Chunky) to complete the `/dh pregen`.
filename = "Chunky-1.3.146.jar.disabled"
side = "both"

